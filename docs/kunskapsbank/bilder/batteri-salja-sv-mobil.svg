<circle cx='70' cy='297' r='22' fill='#fbbf24' fill-opacity='.16' stroke='#fbbf24' stroke-width='2'/><text x='70' y='303' font-size='18' fill='#fbbf24' text-anchor='middle' font-weight='400'>▮</text><text x='70' y='337' font-size='11' fill='#93a0b8' text-anchor='middle' font-weight='400'>Batteri</text>
<circle cx='210' cy='297' r='22' fill='#c4b5fd' fill-opacity='.16' stroke='#c4b5fd' stroke-width='2'/><text x='210' y='303' font-size='18' fill='#c4b5fd' text-anchor='middle' font-weight='400'>⌂</text><text x='210' y='337' font-size='11' fill='#93a0b8' text-anchor='middle' font-weight='400'>Hus</text>
<circle cx='350' cy='297' r='22' fill='#38bdf8' fill-opacity='.16' stroke='#38bdf8' stroke-width='2'/><text x='350' y='303' font-size='18' fill='#38bdf8' text-anchor='middle' font-weight='400'>⚡</text><text x='350' y='337' font-size='11' fill='#93a0b8' text-anchor='middle' font-weight='400'>Nät</text>
<text x='210' y='367' font-size='14' fill='#f3f6fb' text-anchor='middle' font-weight='400'>Av: batteriet täcker bara husets egen</text>
<text x='210' y='386' font-size='14' fill='#f3f6fb' text-anchor='middle' font-weight='400'>förbrukning</text>
