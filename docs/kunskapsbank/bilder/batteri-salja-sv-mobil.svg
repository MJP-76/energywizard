<text x='210' y='189' font-size='14' fill='#f3f6fb' text-anchor='middle' font-weight='400'>På: batteriet kan laddas ur mot nätet när</text>
<text x='210' y='208' font-size='14' fill='#f3f6fb' text-anchor='middle' font-weight='400'>priset är högt</text>
