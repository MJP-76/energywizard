<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 420 423' width='420' height='423' role='img' aria-label='Får batteriet sälja till nätet?' font-family='Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif'>
<rect width='420' height='423' rx='18' fill='#0b1220'/>
<defs><marker id='a22d3a0' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#22d3a0'/></marker><marker id='a38bdf8' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#38bdf8'/></marker><marker id='afbbf24' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#fbbf24'/></marker><marker id='ac4b5fd' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#c4b5fd'/></marker></defs>
<text x='20' y='38' font-size='19' fill='#f3f6fb' text-anchor='start' font-weight='700'>Får batteriet sälja till nätet?</text>
