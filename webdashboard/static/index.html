<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EnergyWizard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/style.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
<div id="login">
  <form class="loginbox" id="loginform">
    <h1 style="margin:0;font-size:1.3rem">⚡ EnergyWizard</h1>
    <input type="text" id="user" placeholder="Användarnamn (admin = ägare)" autocomplete="username">
    <input type="password" id="pw" placeholder="Lösenord" autocomplete="current-password" required>
    <div class="err" id="loginerr"></div>
    <button type="submit">Logga in</button>
    <div class="loginfoot"><span id="loginlang"></span><a href="https://github.com/sponsors/murre87" target="_blank" rel="noopener">❤️ Sponsra</a></div>
  </form>
  <form class="loginbox" id="setupform" style="display:none">
    <div class="loginfoot" style="margin:-6px 0 0"><span id="setuplang"></span></div>
    <h1 style="margin:0;font-size:1.3rem">⚡ Välkommen till EnergyWizard</h1>
    <div class="note" id="setupstep" style="opacity:.7;font-size:.85rem"></div>
    <div id="setupbody" style="display:grid;gap:12px"></div>
    <div class="err" id="setuperr"></div>
    <div class="note" id="setupok" style="color:var(--acc)"></div>
    <button type="submit" id="setupbtn">Fortsätt</button>
  </form>
</div>

<div id="shell">
  <div class="topbar">
    <button class="icobtn" id="menubtn">☰</button>
    <div class="brand"><span class="dot"></span> EnergyWizard</div>
    <button class="icobtn" id="logoutbtn">Logga ut</button>
  </div>
  <nav class="sidebar" id="sidebar"></nav>
  <div id="sidebarbackdrop"></div>
  <div id="sponsorbanner" hidden></div>
  <main id="main"></main>
</div>
<div id="toast"></div>

<script src="i18n/i18n.js"></script>
<script>window.I18N = window.I18N || { lang: "sv", languages: { sv: "Svenska" }, ready: Promise.resolve(), pref: () => "", tr: (s) => s, set() {}, num: (s) => s, missing: () => [], downloadMissing() {}, selectHtml: () => "", TRANSLATE_URL: "https://github.com/murre87/energywizard/blob/main/TRANSLATING.md" };</script>
<script src="static/app.js"></script>
</body>
</html>
