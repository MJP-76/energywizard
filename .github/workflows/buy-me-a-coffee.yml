# Uppdaterar Buy Me a Coffee-avsnittet i README.md med de senaste stödmeddelandena, en gång per natt.
# Action: https://github.com/akosbalasko/coffee-readme - låst till en exakt commit (inte @main),
# eftersom den får skrivrätt till repot.
# Kräver repo-hemligheten BUY_ME_A_COFFEE_TOKEN (skapas på https://developers.buymeacoffee.com/dashboard).
# Utan den hoppar jobbet över sig självt i stället för att misslyckas varje natt.
# Pushen bygger inga Docker-bilder: docker.yml ignorerar ändringar som bara rör README.md.
name: Buy Me A Coffee Readme

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC varje natt

permissions:
  contents: write

jobs:
  bmac-readme:
    name: Uppdatera Buy Me a Coffee i README
    runs-on: ubuntu-latest
    env:
      BMAC_TOKEN: ${{ secrets.BUY_ME_A_COFFEE_TOKEN }}
    steps:
      - name: Hoppa över om token saknas
        if: env.BMAC_TOKEN == ''
        run: echo "BUY_ME_A_COFFEE_TOKEN är inte satt än - inget att uppdatera."
      - uses: akosbalasko/coffee-readme@607cd2adc4fd13135d030aae2a280a12653da3f8
        if: env.BMAC_TOKEN != ''
        with:
          BUY_ME_A_COFFEE_TOKEN: ${{ secrets.BUY_ME_A_COFFEE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER_OF_MESSAGES: 3
          BRANCH: main
